services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: qortex
      POSTGRES_USER: qortex
      POSTGRES_PASSWORD: qortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qortex -d qortex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://qortex:qortex@db:5432/qortex
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-qortex-docker-secret-key-change-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: db
      DB_PORT: "5432"
      RUN_SEED: "0"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
